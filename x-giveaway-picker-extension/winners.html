<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ziggy's Giveaway Picker — Winners</title>
  <link rel="stylesheet" href="winners.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="card">
    <p class="brand">Ziggy's Giveaway Picker</p>
    <h1>Winners</h1>
    <ol id="list"></ol>
    <p id="status" class="meta" role="status" aria-live="polite"></p>
    <p id="meta" class="meta"></p>
    <p id="post" class="post"></p>
    <p id="empty" class="empty hidden">No winners stored yet. Pick winners from the extension popup.</p>
  </main>
  <script src="winners.js"></script>
</body>
</html>
